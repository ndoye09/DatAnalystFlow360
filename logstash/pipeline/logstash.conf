input {
  # Lecture des logs ETL Python
  file {
    path => "/logs/etl-*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["etl", "python"]
  }

  # Logs de monitoring
  file {
    path => "/logs/monitoring-*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["monitoring", "quality"]
  }

  # Logs Docker (optionnel)
  file {
    path => "/logs/docker-*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["docker", "infrastructure"]
  }

  # TCP pour logs en temps réel
  tcp {
    port => 5000
    codec => json
    tags => ["json-input", "realtime"]
  }

  # UDP pour logs légers
  udp {
    port => 5000
    codec => json
    tags => ["udp-input"]
  }
}

filter {
  # Parser les logs Python standards
  if [message] =~ /^\d{4}-\d{2}-\d{2}/ {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:loglevel} - %{GREEDYDATA:message}" }
    }
  }

  # Extraire les métriques de qualité
  if "monitoring" in [tags] {
    grok {
      match => { "message" => "(?<metric_name>\w+): (?<value>[\d.]+)%?" }
      optional => true
    }

    # Convertir les pourcentages en nombres
    if [value] {
      mutate {
        gsub => [ "value", "%", "" ]
        convert => { "value" => "float" }
      }
    }
  }

  # Ajouter des métadonnées temporelles
  mutate {
    add_field => { "[@metadata][index_name]" => "etl-logs-%{+YYYY.MM.dd}" }
  }

  # Ajouter des tags additionnels basés sur le log level
  if [loglevel] == "ERROR" {
    mutate { add_tag => [ "error", "alert" ] }
  } else if [loglevel] == "WARNING" {
    mutate { add_tag => [ "warning" ] }
  }
}

output {
  # Envoyer à Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    user => "elastic"
    password => "elastic_password"
    action => "create"
  }

  # Afficher dans la console pour debug
  stdout {
    codec => rubydebug
  }

  # Logs d'erreurs critiques dans un fichier séparé
  if "alert" in [tags] {
    file {
      path => "/logs/alerts-%{+YYYY.MM.dd}.log"
      message_format => "[%{loglevel}] %{timestamp} - %{message}"
    }
  }
}
