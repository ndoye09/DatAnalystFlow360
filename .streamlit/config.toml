[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
font = "sans serif"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200

[logger]
level = "info"

[client]
showErrorDetails = true
toolbarMode = "auto"
