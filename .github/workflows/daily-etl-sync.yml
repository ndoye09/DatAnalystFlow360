name: Data Lake ETL - Daily Sync

on:
  schedule:
    # Tous les jours à 2h du matin UTC (3h du matin CET)
    - cron: '0 2 * * *'
  
  # Permet de déclencher manuellement depuis GitHub
  workflow_dispatch:

jobs:
  etl-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Cloner le repository
        uses: actions/checkout@v3
      
      - name: 🐍 Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔄 Exécuter l'ETL
        run: |
          echo "🚀 Démarrage du processus ETL..."
          python etl/main.py
      
      - name: 📊 Vérifier les logs
        if: always()
        run: |
          if [ -d "logs" ]; then
            echo "📋 Logs ETL:"
            ls -la logs/
            tail -50 logs/etl_*.log 2>/dev/null || echo "Aucun log trouvé"
          fi
      
      - name: ✅ Succès
        if: success()
        run: echo "🎉 Synchronisation ETL réussie !"
      
      - name: ❌ Rapport d'erreur
        if: failure()
        run: |
          echo "❌ ETL Daily Sync a échoué"
          echo "Consultez les logs ci-dessus pour plus de détails"
          exit 1
